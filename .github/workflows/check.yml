name: Check

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --all-features so the lambda arm of main() is linted too; it is the one
      # branch a server-only build never compiles.
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: cargo fmt --all --check

  test:
    runs-on: ubuntu-latest
    steps:
      # build.rs derives the version string from the git hash and commit date,
      # so the checkout has to keep .git or it degrades to "unknown".
      - uses: actions/checkout@v7
      - name: Run tests
        run: cargo test --all-features --locked

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Type-check frontend
        working-directory: front
        run: |
          npm ci
          npm run typecheck
