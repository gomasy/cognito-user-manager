[package]
name = "cognito-user-manager"
version = "0.1.0"
edition = "2024"

[features]
# Adds the Lambda runtime alongside the server rather than replacing it; which
# one serves is decided at startup. See docs/lambda.md.
lambda = ["dep:lambda_http"]

[dependencies]
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-sdk-cognitoidentityprovider = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
# TLS is pinned to rustls+ring so the build needs no cmake / C toolchain.
aws-smithy-http-client = { version = "1", features = ["rustls-ring"] }
aws-smithy-types = "1"
axum = "0.8"
base64 = "0.23.1"
dotenvy = "0.15"
hmac = "0.13"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
lambda_http = { version = "1", optional = true }
rust-i18n = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }
tower-cookies = "0.11"
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
tower = { version = "0.5", features = ["util"] }

[lints.clippy]
# No request may be able to take the process down. Tests are exempt via clippy.toml.
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
